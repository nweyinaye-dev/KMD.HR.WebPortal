<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Branches" [hidHeader]="true">
      <app-grid-accordion 
        title="Actions & Filters" 
        [newButtonText]="'New Branch'"
        (onSearch)="grid.instance.searchByText($event)"
        (onNew)="grid.instance.addRow()"
        (onExportExcel)="exportExcel()"
        (onRefresh)="grid.instance.refresh()">
      </app-grid-accordion>

      <dx-data-grid
        id="gridContainer"
        [dataSource]="dataSource"
        keyExpr="id"
        [showBorders]="false"
        [allowColumnResizing]="true"
        [columnAutoWidth]="true"
        (onEditingStart)="onEditingStart($event)"
        (onInitNewRow)="onInitNewRow($event)"
        (onToolbarPreparing)="onToolbarPreparing($event)"
        class="premium-grid"
      >
        <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true"></dxo-editing>

        <dxi-column type="buttons" caption="Action" [width]="100">
          <dxi-button name="edit" icon="edit" hint="Edit"></dxi-button>
          <dxi-button name="delete" icon="trash" hint="Delete" cssClass="btn-delete-red"></dxi-button>
        </dxi-column>

        <dxi-column dataField="id" [allowEditing]="false" caption="ID" [width]="50"></dxi-column>
        <dxi-column dataField="branchCode" caption="Branch Code">
          <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="branchName" caption="Branch Name">
          <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="address" caption="Address">
          <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxi-column dataField="branchType" caption="Branch Type">
          <dxo-lookup [dataSource]="types"></dxo-lookup>
          <dxi-validation-rule type="required"></dxi-validation-rule>
        </dxi-column>
        <dxo-paging [pageSize]="10"></dxo-paging>
        <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 25, 50]"></dxo-pager>
      </dx-data-grid>
    </app-card>
  </div>
</div>
