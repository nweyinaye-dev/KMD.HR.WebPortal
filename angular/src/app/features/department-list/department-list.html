<app-card cardTitle="Department List">
  <div class="toolbar">
    <dx-button text="Add Department" icon="add" type="default" (onClick)="onAddClick()"></dx-button>
    <dx-button text="Refresh" icon="refresh" type="normal" (onClick)="onRefreshClick()"></dx-button>
  </div>

  <dx-data-grid
    [dataSource]="departments"
    [keyExpr]="keyExpr"
    (onRowUpdating)="onRowUpdating($event)"
    (onRowInserted)="onRowInserted($event)"
    (onRowRemoving)="onRowRemoving($event)"
    [showBorders]="true"
    [hoverStateEnabled]="true"
    [rowAlternationEnabled]="true"
  >
    <dxo-paging [enabled]="true" [pageSize]="10"></dxo-paging>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>

    <dxo-editing mode="row" [allowUpdating]="true" [allowDeleting]="true" [allowAdding]="true" [useIcons]="true"></dxo-editing>

    <dxi-column dataField="code" caption="Department Code" [width]="150">
      <dxi-validation-rule type="required" message="Code is required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="name" caption="Department Name">
      <dxi-validation-rule type="required" message="Name is required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="isActive" caption="Active" dataType="boolean" [width]="100">
      <dxo-lookup [dataSource]="activeOptions" valueExpr="value" displayExpr="text"></dxo-lookup>
    </dxi-column>

    <dxi-column dataField="managerId" caption="Manager ID" [width]="120" dataType="number">
      <dxi-validation-rule type="numeric"></dxi-validation-rule>
    </dxi-column>
  </dx-data-grid>
</app-card>
